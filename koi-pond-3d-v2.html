<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Koi Pond 3D</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b4a55; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
  #bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 8px; z-index: 5; transition: opacity .6s; }
  #bar button { font: 600 13px system-ui, sans-serif; color: #fff; background: rgba(5,45,58,.55); border: 1px solid rgba(255,255,255,.25);
    padding: 8px 14px; border-radius: 22px; cursor: pointer; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #bar button:hover { background: rgba(10,80,100,.7); }
  #bar button.on { background: rgba(255,120,150,.75); border-color: #fff; }
  #menu { position: fixed; left: 50%; bottom: 62px; transform: translateX(-50%); display: none; flex-direction: column; gap: 6px; z-index: 6;
    background: rgba(5,45,58,.8); padding: 10px; border-radius: 14px; border: 1px solid rgba(255,255,255,.25); backdrop-filter: blur(10px); }
  #menu button { font: 500 13px system-ui, sans-serif; color: #fff; background: rgba(255,255,255,.12); border: 0; padding: 9px 14px; border-radius: 10px; cursor: pointer; text-align: left; }
  #menu button:hover { background: rgba(255,255,255,.25); }
  #menu small { color: #bfe; font-size: 11px; max-width: 250px; line-height: 1.35; }
  #msg { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); color: #fff; font-size: 13px; background: rgba(5,45,58,.6); padding: 6px 14px; border-radius: 18px; opacity: 0; transition: opacity .5s; pointer-events: none; z-index: 7; }
  body.noui #bar, body.noui #menu { display: none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar">
  <button id="bMusic">🎵 Music mode</button>
  <button id="bSuit">👙 Swimsuits</button>
  <button id="bFull">⛶ Fullscreen</button>
</div>
<div id="menu">
  <button id="mTab">🖥️ Tab / system audio (best)</button>
  <button id="mMic">🎤 Microphone (laptop speakers)</button>
  <button id="mDemo">🥁 Demo beat (no audio)</button>
  <small>Tab audio: pick the tab playing your music and tick "Share tab audio". Microphone: play music out loud and allow the mic.</small>
</div>
<div id="msg"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js';

/* ---------- setup ---------- */
const Q = new URLSearchParams(location.search);
if (Q.get('ui') === '0') document.body.classList.add('noui');
const FF = parseFloat(Q.get('t') || '0');
let seed = parseInt(Q.get('seed') || '7');
function rng() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const rnd = (a, b) => a + (b - a) * rng();
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;

const FOV = 38, CAMH = 16;
const camera = new THREE.PerspectiveCamera(FOV, 1, 0.5, 60);
camera.position.set(0, CAMH, 0); camera.up.set(0, 0, -1); camera.lookAt(0, 0, 0);
const extent = y => { const hh = Math.tan(FOV / 2 * Math.PI / 180) * (CAMH - y); return { hw: hh * camera.aspect, hh }; };

const underScene = new THREE.Scene();
const topScene = new THREE.Scene();
const waterScene = new THREE.Scene();
const ortho = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
let rt = null;

/* ---------- environment (sky reflections on wet skin) ---------- */
function makeEnv() {
  const s = new THREE.Scene();
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    vertexShader: 'varying vec3 vP; void main(){vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
    fragmentShader: 'varying vec3 vP; void main(){ vec3 d=normalize(vP); float h=d.y*.5+.5; vec3 c=mix(vec3(.5,.72,.8),vec3(.3,.55,.9),pow(h,1.4)); c+=vec3(1.,.95,.85)*pow(max(dot(d,normalize(vec3(-.4,.8,.45))),0.),48.)*5.; gl_FragColor=vec4(c,1.);}'
  });
  s.add(new THREE.Mesh(new THREE.SphereGeometry(50, 32, 16), mat));
  const pm = new THREE.PMREMGenerator(renderer);
  const tex = pm.fromScene(s, 0.04).texture; pm.dispose();
  return tex;
}
const envTex = makeEnv();

function addLights(scene) {
  scene.add(new THREE.HemisphereLight(0xcdf3ff, 0x0b3a44, 1.0));
  const d = new THREE.DirectionalLight(0xfff0d8, 2.6); d.position.set(-6, 12, 4); scene.add(d);
}
addLights(underScene); addLights(topScene);

/* ---------- floor (pebbles, algae, pad shadows) ---------- */
const MAXPADS = 8;
const floorMat = new THREE.ShaderMaterial({
  uniforms: { uPads: { value: Array.from({ length: MAXPADS }, () => new THREE.Vector3(0, 0, 0)) } },
  vertexShader: 'varying vec3 vW; void main(){ vec4 w=modelMatrix*vec4(position,1.); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }',
  fragmentShader: `
    varying vec3 vW; uniform vec3 uPads[${MAXPADS}];
    float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
    vec2 hash2(vec2 p){ return vec2(hash(p),hash(p+19.7)); }
    float noise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
      return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y); }
    float fbm(vec2 p){ float a=.5,s=0.; for(int i=0;i<4;i++){ s+=a*noise(p); p*=2.03; a*=.5; } return s; }
    vec3 pebbles(vec2 p, float sc){
      vec2 q=p*sc; vec2 ip=floor(q), fp=fract(q);
      float md=9.; vec2 mid=vec2(0.);
      for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){
        vec2 g=vec2(float(i),float(j)); vec2 o=hash2(ip+g);
        vec2 r=g+o*.8+.1-fp; float d=dot(r,r); if(d<md){ md=d; mid=ip+g; } }
      float h1=hash(mid);
      vec3 base=mix(vec3(.10,.09,.07),vec3(.34,.29,.20),h1);
      base=mix(base,vec3(.16,.20,.17),step(.72,hash(mid+3.))*.9);
      base=mix(base,vec3(.40,.36,.30),step(.9,hash(mid+8.))*.8);
      float sh=smoothstep(.2,.0,md);
      return base*mix(.06,1.25,sh*sh);
    }
    void main(){
      vec2 p=vW.xz;
      vec3 col=(pebbles(p,1.3)*.75+pebbles(p+7.,3.2)*.15)*.55;
      float alg=fbm(p*.35);
      col=mix(col,vec3(.03,.16,.11),smoothstep(.45,.8,alg)*.55);
      col*=.75+.5*fbm(p*.9);
      for(int i=0;i<${MAXPADS};i++){ if(uPads[i].z>0.){ float d=length(p-uPads[i].xy-vec2(.9,-.6)); col*=1.-smoothstep(uPads[i].z,uPads[i].z*.55,d)*.55; } }
      gl_FragColor=vec4(col,1.);
    }`
});
const floor = new THREE.Mesh(new THREE.PlaneGeometry(90, 90), floorMat);
floor.rotation.x = -Math.PI / 2; floor.frustumCulled = false; underScene.add(floor);

/* ---------- water surface shader (refraction, ripples, caustics, glints) ---------- */
const NR = 10;
const waterMat = new THREE.ShaderMaterial({
  depthTest: false, depthWrite: false,
  uniforms: {
    tRT: { value: null }, uT: { value: 0 }, uAsp: { value: 1 }, uGlow: { value: 0 },
    uR: { value: Array.from({ length: NR }, () => new THREE.Vector4(0, 0, -100, 0)) },
    uM: { value: new THREE.Vector3(0, 0, 0) }
  },
  vertexShader: 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }',
  fragmentShader: `
    precision highp float;
    varying vec2 vUv; uniform sampler2D tRT; uniform float uT,uAsp,uGlow; uniform vec4 uR[${NR}]; uniform vec3 uM;
    float H(vec2 p){
      float h=0.;
      h+=sin(p.x*22.+uT*.9+sin(p.y*9.+uT*.5)*1.5)*.0011;
      h+=sin(p.y*31.-uT*1.1+p.x*6.)*.0007;
      h+=sin((p.x+p.y)*47.+uT*1.7)*.0004;
      for(int i=0;i<${NR};i++){
        vec4 r=uR[i]; float age=uT-r.z;
        if(r.w>0. && age>0. && age<6.){
          float d=length(p-r.xy); float f=d-age*.16;
          h+=sin(f*150.)*exp(-f*f*700.)*exp(-age*.75)*r.w*.0013;
        }
      }
      if(uM.z>0.){
        float d=length(p-uM.xy); float f=d-.045;
        h+=exp(-f*f*3500.)*.0036*uM.z;
        float f2=d-.085; h+=exp(-f2*f2*3500.)*.0016*uM.z;
      }
      return h;
    }
    float caustic(vec2 uv,float t){
      vec2 p=mod(uv*6.28318,6.28318)-250.; vec2 i=p; float c=1.; float inten=.005;
      for(int n=0;n<5;n++){ float tt=t*(1.-(3.5/float(n+1)));
        i=p+vec2(cos(tt-i.x)+sin(tt+i.y),sin(tt-i.y)+cos(tt+i.x));
        c+=1./length(vec2(p.x/(sin(i.x+tt)/inten),p.y/(cos(i.y+tt)/inten))); }
      c/=5.; c=1.17-pow(c,1.4); return pow(abs(c),8.);
    }
    void main(){
      vec2 p=vec2(vUv.x*uAsp,vUv.y);
      float e=.0016;
      vec2 n=vec2(H(p+vec2(e,0.))-H(p-vec2(e,0.)),H(p+vec2(0.,e))-H(p-vec2(0.,e)))/(2.*e);
      vec2 off=n*.05;
      vec3 col=vec3(texture2D(tRT,vUv+off*1.07).r,texture2D(tRT,vUv+off).g,texture2D(tRT,vUv+off*.93).b);
      col=mix(col,vec3(.02,.32,.40),.22);
      col*=vec3(.82,1.0,1.04);
      float cc=caustic(p*1.5+n*.15,uT*.55);
      col+=cc*vec3(.28,.62,.60)*(.38+uGlow*.6);
      vec3 N=normalize(vec3(-n*3.,1.));
      vec3 Hh=normalize(normalize(vec3(-.4,.5,.75))+vec3(0.,0.,1.));
      float s=pow(max(dot(N,Hh),0.),420.)*3.2;
      col+=s*vec3(1.,.97,.9);
      col+=dot(n,normalize(vec2(-.5,.6)))*.35;
      col+=vec3(.5,.8,.9)*length(n)*.12;
      col*=1.-.38*pow(length(vUv-.5)*1.25,2.);
      col=col/(1.+col*.12);
      col=pow(max(col,0.),vec3(1./2.2));
      gl_FragColor=vec4(col,1.);
    }`
});
waterScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), waterMat));
waterScene.children[0].frustumCulled = false;

let rippleIdx = 0;
const tmpV = new THREE.Vector3();
let simT = 0;
function ripple(wx, wz, amp = 1) {
  tmpV.set(wx, 1.6, wz).project(camera);
  waterMat.uniforms.uR.value[rippleIdx].set((tmpV.x * .5 + .5) * camera.aspect, tmpV.y * .5 + .5, simT, amp);
  rippleIdx = (rippleIdx + 1) % NR;
}

/* ---------- textures ---------- */
function blob(ctx, cx, cy, rx, ry, rgb, n = 12) {
  for (let k = 0; k < n; k++) {
    const ox = cx + rnd(-rx, rx) * .6, oy = cy + rnd(-ry, ry) * .6, r = rnd(.38, .72) * rx;
    ctx.save(); ctx.translate(ox, oy); ctx.scale(1, ry / rx);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
    g.addColorStop(0, `rgba(${rgb},1)`); g.addColorStop(.74, `rgba(${rgb},1)`); g.addColorStop(1, `rgba(${rgb},0)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill(); ctx.restore();
  }
}
const KINDS = {
  kohaku:  { fin: 0xf4f1ea },
  sanke:   { fin: 0xf4f1ea },
  ogon:    { fin: 0xf2c25a },
  showa:   { fin: 0xd6cfc8 },
  tancho:  { fin: 0xf4f1ea },
  orange:  { fin: 0xff9a4a },
  shusui:  { fin: 0xa9bccb }
};
function makeSkin(kind) {
  const W = 1024, Hh = 512, c = document.createElement('canvas'); c.width = W; c.height = Hh;
  const ctx = c.getContext('2d');
  const back = () => 256 + rnd(-35, 35);
  if (kind === 'kohaku' || kind === 'sanke' || kind === 'tancho') { ctx.fillStyle = '#f6f3ec'; ctx.fillRect(0, 0, W, Hh); }
  if (kind === 'showa') { ctx.fillStyle = '#16161a'; ctx.fillRect(0, 0, W, Hh); }
  if (kind === 'ogon') { const g = ctx.createLinearGradient(0, 0, 0, Hh); g.addColorStop(0, '#f1d27a'); g.addColorStop(.5, '#c98a22'); g.addColorStop(1, '#f1d27a'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, Hh); }
  if (kind === 'orange') { ctx.fillStyle = '#ef7a2c'; ctx.fillRect(0, 0, W, Hh); }
  if (kind === 'shusui') { const g = ctx.createLinearGradient(0, 0, 0, Hh); g.addColorStop(0, '#d9e2ea'); g.addColorStop(.5, '#4e6b88'); g.addColorStop(1, '#d9e2ea'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, Hh); }
  const red = '216,56,32', black = '24,24,28', white = '246,243,236';
  if (kind === 'kohaku') { for (let i = 0; i < 4; i++) blob(ctx, 120 + i * 230 + rnd(-30, 30), back(), rnd(90, 160), rnd(70, 120), red, 14); }
  if (kind === 'sanke') {
    for (let i = 0; i < 3; i++) blob(ctx, 140 + i * 300 + rnd(-30, 30), back(), rnd(100, 160), rnd(70, 110), red, 14);
    for (let i = 0; i < 4; i++) blob(ctx, 220 + i * 210 + rnd(-40, 40), 256 + rnd(-90, 90), rnd(30, 60), rnd(24, 42), black, 6);
  }
  if (kind === 'showa') {
    for (let i = 0; i < 3; i++) blob(ctx, 130 + i * 330 + rnd(-30, 30), back(), rnd(110, 170), rnd(80, 120), red, 14);
    blob(ctx, 80, 256, 70, 60, white, 8);
    for (let i = 0; i < 2; i++) blob(ctx, 330 + i * 380, 256 + rnd(-70, 70), rnd(60, 90), rnd(40, 70), white, 8);
  }
  if (kind === 'tancho') blob(ctx, 85, 256, 58, 52, red, 10);
  if (kind === 'ogon') { for (let i = 0; i < 6; i++) blob(ctx, rnd(60, 960), 256 + rnd(-110, 110), rnd(60, 120), rnd(30, 60), '248,222,130', 6); }
  if (kind === 'orange') { for (let i = 0; i < 5; i++) blob(ctx, rnd(60, 960), 256 + rnd(-100, 100), rnd(60, 130), rnd(30, 70), i % 2 ? '252,170,90' : '210,70,30', 7); }
  if (kind === 'shusui') { for (let i = 0; i < 3; i++) blob(ctx, 160 + i * 300, 120 + (i % 2) * 270 + rnd(-20, 20), rnd(70, 120), rnd(30, 50), '232,110,44', 8); }
  // belly lightening
  const bg = ctx.createLinearGradient(0, 0, 0, Hh);
  const ba = kind === 'showa' ? .25 : .5;
  bg.addColorStop(0, `rgba(255,255,255,${ba})`); bg.addColorStop(.22, 'rgba(255,255,255,0)'); bg.addColorStop(.78, 'rgba(255,255,255,0)'); bg.addColorStop(1, `rgba(255,255,255,${ba})`);
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, Hh);
  // scales
  for (let y = 4, row = 0; y < Hh; y += 14, row++) for (let x = (row % 2) * 8; x < W; x += 16) {
    ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI);
    ctx.strokeStyle = 'rgba(255,255,255,0.13)'; ctx.lineWidth = 1.4; ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y - 1, 9, 0.1, Math.PI - .1);
    ctx.strokeStyle = 'rgba(0,0,0,0.07)'; ctx.lineWidth = 1; ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  return tex;
}
const skinCache = {};
function skinFor(k) { return skinCache[k] || (skinCache[k] = makeSkin(k)); }

function makeFinTex() {
  const S = 128, c = document.createElement('canvas'); c.width = c.height = S;
  const ctx = c.getContext('2d'); const id = ctx.createImageData(S, S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const u = x / (S - 1), v = y / (S - 1);
    const rays = .5 + .5 * Math.cos(v * Math.PI * 2 * 12 + Math.sin(u * 3) * .4);
    let a = (.3 + .45 * rays) * (1 - Math.pow(u, 2.6)) * (.45 + .55 * smooth(0, .12, Math.min(v, 1 - v)) );
    a = Math.max(a, 0);
    const i = (y * S + x) * 4; id.data[i] = id.data[i + 1] = id.data[i + 2] = 255; id.data[i + 3] = Math.round(clamp(a, 0, 1) * 255);
  }
  ctx.putImageData(id, 0, 0);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const finTex = makeFinTex();

/* swimsuit fabrics */
function makeFabric(kind, c1, c2) {
  const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d');
  x.fillStyle = c1; x.fillRect(0, 0, 128, 128);
  x.fillStyle = c2;
  if (kind === 'stripes') for (let i = 0; i < 128; i += 32) x.fillRect(i, 0, 16, 128);
  if (kind === 'dots') for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { x.beginPath(); x.arc(16 + i * 32 + (j % 2) * 16, 16 + j * 32, 7, 0, 7); x.fill(); }
  if (kind === 'wave') { x.strokeStyle = c2; x.lineWidth = 8; for (let j = 0; j < 4; j++) { x.beginPath(); for (let i = 0; i <= 128; i += 4) x.lineTo(i, 16 + j * 32 + Math.sin(i / 10) * 8); x.stroke(); } }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
const SUITS = [
  { fabric: ['stripes', '#ff4f7a', '#ffffff'], style: 'bikini' },
  { fabric: ['dots', '#25b4f0', '#ffffff'], style: 'trunks' },
  { fabric: ['wave', '#ffd23d', '#ff6a2b'], style: 'trunks' },
  { fabric: ['dots', '#8a5cf0', '#ffe6f5'], style: 'bikini' },
  { fabric: ['stripes', '#1fc28a', '#fff6c8'], style: 'trunks' },
  { fabric: ['wave', '#ff8fb1', '#ffffff'], style: 'bikini' },
  { fabric: ['stripes', '#ff6a2b', '#2a3b8f'], style: 'trunks' }
];

/* ---------- koi ---------- */
const NR_ = 34, MS = 18;
const profile = t => t < .3 ? Math.pow(Math.sin(t / .3 * Math.PI / 2), .5) : 1 - .86 * Math.pow((t - .3) / .7, 1.5);

const FIN_TAIL_R = 8, FIN_TAIL_C = 10, FIN_P_R = 5, FIN_P_C = 4;
function gridIdx(R, C, off, idx) {
  for (let i = 0; i < R; i++) for (let j = 0; j < C; j++) {
    const a = off + i * (C + 1) + j, b = a + 1, c = a + (C + 1), d = c + 1;
    idx.push(a, b, c, b, d, c);
  }
}

class Fish {
  constructor(kind, L, suit) {
    this.kind = kind; this.L = L; this.W = .12 * L;
    this.px = 0; this.pz = 0; this.psi = rnd(0, 6.28); this.speed = rnd(.9, 1.4); this.base = this.speed;
    this.tvS = 0; this.phase = rnd(0, 6.28); this.s1 = rnd(0, 6.28); this.s2 = rnd(0, 6.28); this.s3 = rnd(0, 6.28);
    this.py = .45; this.kick = 0; this.id = 0;
    // body
    const bpos = new Float32Array(NR_ * (MS + 1) * 3), buv = new Float32Array(NR_ * (MS + 1) * 2), bidx = [];
    for (let i = 0; i < NR_; i++) for (let j = 0; j <= MS; j++) { const k = i * (MS + 1) + j; buv[k * 2] = i / (NR_ - 1); buv[k * 2 + 1] = j / MS; }
    for (let i = 0; i < NR_ - 1; i++) for (let j = 0; j < MS; j++) { const a = i * (MS + 1) + j, b = a + 1, c = a + MS + 1, d = c + 1; bidx.push(a, b, c, b, d, c); }
    this.bGeo = new THREE.BufferGeometry();
    this.bGeo.setAttribute('position', new THREE.BufferAttribute(bpos, 3));
    this.bGeo.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(bpos.length), 3));
    this.bGeo.setAttribute('uv', new THREE.BufferAttribute(buv, 2));
    this.bGeo.setIndex(bidx);
    this.body = new THREE.Mesh(this.bGeo, new THREE.MeshPhysicalMaterial({
      map: skinFor(kind), roughness: .42, metalness: kind === 'ogon' ? .35 : 0, clearcoat: .7, clearcoatRoughness: .22,
      envMap: envTex, envMapIntensity: .75, side: THREE.DoubleSide
    }));
    // fins

  audio.lastBeat = simT; audio.beats++; audio.beatPulse = 1;
  fish.forEach((f, i) => { f.kick = 1; if ((i + audio.beats) % 3 === 0) ripple(f.px + Math.cos(f.psi) * f.L * .5, f.pz - Math.sin(f.psi) * f.L * .5, .6 + str * .4); });
  if (audio.beats % 4 === 0) { const e = extent(1.6); ripple(rnd(-e.hw, e.hw) * .8, rnd(-e.hh, e.hh) * .8, 1); }
}
function danceTarget(f, i, n, t) {
  const e = bounds, B = audio.bass;
  const rx = e.hw * .62, rz = e.hh * .68;
  let a, x, z, lead = .45;
  switch (ROUTINES[routine]) {
    case 'orbit': a = i / n * 6.283 + t * .5; x = Math.cos(a + lead) * rx * (.85 + .15 * B); z = Math.sin(a + lead) * rz * (.85 + .15 * B); break;
    case 'figure8': a = t * .42 + i * .55 + lead; x = Math.sin(a) * e.hw * .7; z = Math.sin(2 * a) * e.hh * .55; break;
    case 'bloom': a = i / n * 6.283 + t * .25 + lead; { const r = .25 + .6 * (.5 + .5 * Math.sin(t * .7)); x = Math.cos(a) * rx * r * 1.15; z = Math.sin(a) * rz * r * 1.15; } break;
    default: a = t * .33 - i * .16 + lead; x = Math.sin(a * 1.3) * e.hw * .8; z = Math.sin(a * 2.6 + .5) * e.hh * .55;
  }
  return [x, z];
}

/* ---------- simulation ---------- */
let nextDrop = 3;
function stepFish(f, dt, i, n) {
  const t = simT;
  const fx = Math.cos(f.psi), fz = -Math.sin(f.psi);
  let vx = fx * .6, vz = fz * .6, tspeed = f.base, calm = 1;
  // edges
  const mx = bounds.hw - 1.2, mz = bounds.hh - 1.0;
  const ex = Math.max(0, Math.abs(f.px) - mx), ez = Math.max(0, Math.abs(f.pz) - mz);
  if (ex > 0) vx += -Math.sign(f.px) * Math.min(ex, 1.5) * 1.6; if (ez > 0) vz += -Math.sign(f.pz) * Math.min(ez, 1.5) * 1.6;
  // separation
  for (const o of fish) if (o !== f) { const dx = f.px - o.px, dz = f.pz - o.pz, d = Math.hypot(dx, dz), lim = (f.L + o.L) * .3; if (d < lim && d > 1e-3) { vx += dx / d * (lim - d) * 1.4; vz += dz / d * (lim - d) * 1.4; } }
  const dancing = audio.on && audio.level > .04;
  let danceSpd = 0;
  if (dancing) {
    const [tx, tz] = danceTarget(f, i, n, t); const dx = tx - f.px, dz = tz - f.pz, d = Math.hypot(dx, dz) || 1;
    vx += dx / d * 3; vz += dz / d * 3; tspeed = clamp(d * 1.1, 1.4, 4.2) * (1 + audio.bass * .5); calm = .15;
  } else {
    if (mouse.active) { const hx = f.px + fx * f.L * .4, hz = f.pz + fz * f.L * .4, dx = hx - mouse.x, dz = hz - mouse.z, d = Math.hypot(dx, dz);
      if (d < 3.4 && d > 1e-3) { const k = (3.4 - d) / 3.4; vx += dx / d * k * 6; vz += dz / d * k * 6; tspeed = f.base * (1 + k * 2.2); calm = .2; } }
    let best = null, bd = 1e9;
    for (const fo of foods) { const d = Math.hypot(fo.x - f.px, fo.z - f.pz); if (d < bd) { bd = d; best = fo; } }
    if (best && bd < 14) { const dx = best.x - f.px, dz = best.z - f.pz; vx += dx / bd * 2.4; vz += dz / bd * 2.4; tspeed = f.base * 1.5; calm = .25;
      const mxp = f.px + fx * f.L * .5, mzp = f.pz + fz * f.L * .5;
      if (Math.hypot(best.x - mxp, best.z - mzp) < .45) { best.eaten = true; ripple(best.x, best.z, .8); f.kick = .8; } }
  }
  const want = Math.atan2(-vz, vx);
  let tv = clamp(angDiff(want, f.psi) * (dancing ? 3.2 : 2.2), -3, 3);
  tv += calm * (.5 * Math.sin(t * .37 + f.s1) + .35 * Math.sin(t * .91 + f.s2));
  f.tvS += (tv - f.tvS) * Math.min(1, dt * 4);
  f.psi += f.tvS * dt;
  f.speed += (tspeed * (1 + f.kick * .8) - f.speed) * Math.min(1, dt * 2.2);
  f.px += Math.cos(f.psi) * f.speed * dt; f.pz += -Math.sin(f.psi) * f.speed * dt;
  f.kick *= Math.exp(-dt * 3.5);
  f.py = .42 + .2 * Math.sin(t * .3 + f.s3) + (dancing ? .08 * audio.bass * Math.sin(t * 6 + i) : 0);
}
function sim(dt) {
  simT += dt;
  updateAudio(dt);
  waterMat.uniforms.uT.value = simT; waterMat.uniforms.uGlow.value = audio.bass * .8;
  for (let i = 0; i < fish.length; i++) stepFish(fish[i], dt, i, fish.length);
  const energy = audio.on ? audio.level : 0;
  fish.forEach(f => f.update(dt, energy));
  for (let i = foods.length - 1; i >= 0; i--) { const fo = foods[i]; fo.age += dt; fo.m.position.y = 1.72 + .015 * Math.sin(simT * 2 + i);
    if (fo.eaten || fo.age > 28) { topScene.remove(fo.m); foods.splice(i, 1); } }
  const padU = floorMat.uniforms.uPads.value;
  pads.forEach((p, i) => {
    p.g.position.x = p.bx + Math.sin(simT * .1 + p.ph) * .35; p.g.position.z = p.bz + Math.cos(simT * .08 + p.ph) * .3;
    p.g.rotation.y += p.spin * dt; const sc = 1 + audio.bass * .07; p.g.scale.setScalar(sc);
    p.g.position.y = PADY + .02 * Math.sin(simT * .9 + p.ph) + audio.bass * .05;
    if (i < MAXPADS) padU[i].set(p.g.position.x, p.g.position.z, p.rad * 1.05);
  });
  if (simT > nextDrop) { nextDrop = simT + rnd(2.5, 6); const e = extent(1.6); ripple(rnd(-e.hw, e.hw) * .9, rnd(-e.hh, e.hh) * .9, rnd(.4, .8)); }
}

/* ---------- loop ---------- */
function resize() {
  const w = innerWidth, h = innerHeight, pr = renderer.getPixelRatio();
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  if (rt) rt.dispose();
  rt = new THREE.WebGLRenderTarget(Math.floor(w * pr), Math.floor(h * pr), { samples: 4, type: THREE.HalfFloatType, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter });
  waterMat.uniforms.tRT.value = rt.texture; waterMat.uniforms.uAsp.value = camera.aspect;
  bounds = extent(.45);
}
addEventListener('resize', resize);
resize(); placePads(); placeFish();
if (Q.get('suits') === '1') toggleSuits(true);
if (Q.get('music') === '1') startAudio('demo');
for (let t = 0; t < FF; t += 1 / 30) sim(1 / 30);

function render() {
  renderer.setRenderTarget(rt); renderer.setClearColor(0x000000, 1); renderer.clear(); renderer.render(underScene, camera);
  renderer.setRenderTarget(null); renderer.autoClear = true; renderer.render(waterScene, ortho);
  renderer.autoClear = false; renderer.clearDepth(); renderer.render(topScene, camera); renderer.autoClear = true;
}
let last = 0;
function frame(now) {
  if (!last) last = now;
  const dt = clamp((now - last) / 1000, 0, .05); last = now;
  if (!paused) sim(dt);
  render(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
setTimeout(() => say('Move to ripple the water. Click to feed. M = music, S = swimsuits, F = fullscreen.', 6000), 800);
window.__koi = { ready: true, fish, audio };
if (Q.get('dbg')) setTimeout(()=>{document.title=JSON.stringify(fish.map(f=>[+f.px.toFixed(1),+f.pz.toFixed(1),+f.speed.toFixed(1)]))+' b'+audio.bass.toFixed(2)+' r'+routine+' hw'+bounds.hw.toFixed(1)},1500);
</script>
